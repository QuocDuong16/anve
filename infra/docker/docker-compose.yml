# AnVề local development stack.
#
# Usage:
#   make up        # start postgres + api
#   make down      # stop the stack
#   make logs      # follow the logs
#
# The compose file lives in infra/docker/ but runs with the repository root as
# the project directory, so relative paths (../../apps/server) and the .env
# file at the root behave the same locally and in CI.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hardening for the application container: drop all capabilities, prevent
# privilege escalation, and mount a read-only root filesystem.
x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgis/postgis:17-3.6@sha256:d7053f57b0d62c427ffbf412208b6625317124d62eebf40672e990fea81e9d53
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anve}
      POSTGRES_DB: ${POSTGRES_DB:-anve}
      # Deterministic collation so ORDER BY does not change between machines.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Loopback only: with the dev default password, the database must not be
      # reachable from other machines on the network. Production deployments
      # keep the database on an internal network and publish no port at all.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-anve} -d $${POSTGRES_DB:-anve}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging
    networks:
      - data
      # Publishes the loopback port above: Docker does not install port
      # forwarding for containers whose only network is internal, so the
      # database also joins this otherwise-empty bridge. No other service
      # attaches here.
      - db-host

  migrate:
    <<: *security
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    # The image has an exec-form ENTRYPOINT, so the migrator has to replace
    # the entrypoint itself — a plain `command` would only be appended as
    # arguments to the API binary.
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-anve}:${POSTGRES_PASSWORD:-anve}@postgres:5432/${POSTGRES_DB:-anve}?sslmode=disable
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./infra/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - data

  api:
    <<: *security
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      # Inside the container the process has to accept connections from the
      # Docker port mapping, so it listens on the container's interfaces.
      # That is not a public exposure: the published host port below is
      # bound to 127.0.0.1. A development login enabled here additionally
      # needs the explicit network opt-in and the source allowlist.
      LISTEN_ADDR: 0.0.0.0:8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-anve}:${POSTGRES_PASSWORD:-anve}@postgres:5432/${POSTGRES_DB:-anve}?sslmode=disable
      # Google sign-in stays disabled until an OAuth client ID is provided;
      # the API fails closed rather than accepting unverified tokens.
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      # ADC must be supplied separately by the deployment environment.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # Development login. Disabled by default; when enabled for the local
      # stack, the opt-in and allowlist below are mandatory (the server
      # refuses to start otherwise). The allowlist names the pinned edge
      # network's subnet, because Docker rewrites the source address to the
      # bridge gateway. Nothing outside this host can reach the endpoint:
      # the published port is loopback-only.
      AUTH_DEV_LOGIN_ENABLED: ${AUTH_DEV_LOGIN_ENABLED:-false}
      AUTH_DEV_LOGIN_ALLOW_NETWORK: ${AUTH_DEV_LOGIN_ALLOW_NETWORK:-false}
      AUTH_DEV_LOGIN_ALLOWED_CIDRS: ${AUTH_DEV_LOGIN_ALLOWED_CIDRS:-127.0.0.0/8,::1/128,172.28.0.0/24}
      # M3: consented location retention, measured from device capture time.
      # Also the accepted backfill window for late offline uploads.
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-30}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Loopback only: the API must not be reachable from the LAN by
      # accident. The Android emulator reaches it through 10.0.2.2, and a
      # physical device through `adb reverse tcp:8080 tcp:8080`.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *logging
    networks:
      - edge
      - data

volumes:
  postgres_data:

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-anve}-edge
    driver: bridge
    # Pinned so the development-login source allowlist can name the bridge
    # subnet deterministically instead of trusting a range discovered after
    # the fact. Pick another /24 if it collides with an existing network.
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data:
    name: ${COMPOSE_PROJECT_NAME:-anve}-data
    driver: bridge
    internal: true
  db-host:
    name: ${COMPOSE_PROJECT_NAME:-anve}-db-host
    driver: bridge
