openapi: 3.1.0

info:
  title: AnVề API
  version: 0.5.0
  description: |
    HTTP contract of the AnVề backend.

    This file is the single source of truth for the API surface. The Go
    server and the Android client are both expected to be generated from —
    or at least checked against — this document.
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Liveness and readiness probes
  - name: meta
    description: Build and service metadata
  - name: auth
    description: Sign-in, sessions and token refresh
  - name: me
    description: "The authenticated account: profile and privacy consent"
  - name: devices
    description: Devices and sessions of the authenticated account
  - name: locations
    description: Consent-controlled location ingestion and audience-authorized reads
  - name: location-sharing
    description: Explicit per-member location audience grants
  - name: circles
    description: Family Circle, membership and invites

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: |
        Returns 200 as long as the process is running. It does not check any
        downstream dependency, so a failing database never restarts the API.
      tags: [health]
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Returns 200 when the service is ready to accept traffic. Since M1 the
        business endpoints are database-backed, so readiness includes a
        database round-trip.
      tags: [health]
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/version:
    get:
      operationId: getVersion
      summary: Read the running build version
      tags: [meta]
      responses:
        "200":
          description: The running build version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Which sign-in methods this server supports
      description: |
        Public endpoint the app calls before showing a sign-in screen. A
        production server never advertises the development login.
      tags: [auth]
      responses:
        "200":
          description: The enabled sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /api/v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for an AnVề session
      description: |
        Verifies the Google ID token (signature, issuer, audience, expiry),
        creates the user on first sign-in, registers or reuses the device and
        returns a freshly issued session (access + refresh token). The Google
        token is used exactly once and never stored.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
      responses:
        "200":
          description: A session for the verified Google identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The Google token failed verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The verified email already belongs to an account created through the development login (code `IDENTITY_CONFLICT`). Development identities never take over a Google account and vice versa."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Google sign-in is not configured on this server (code `AUTH_NOT_CONFIGURED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/dev-login:
    post:
      operationId: devLogin
      summary: Development-only sign-in without an identity provider
      description: |
        Only mounted when the server runs with `AUTH_DEV_LOGIN_ENABLED=true`
        and `ENVIRONMENT=development` (exactly that value; staging, production
        and unknown environments refuse to start with the flag). The endpoint
        therefore cannot exist in any other environment.

        Network boundary: the request must originate from an address in the
        server's development-login allowlist (loopback by default). Proxy
        headers such as `X-Forwarded-For` are never trusted for this check.
        A source outside the allowlist receives 403 `DEV_LOGIN_NETWORK_DENIED`
        before any user or session is created.

        The fixture is an isolated identity: it refuses an email that already
        belongs to a Google-verified account, and a Google sign-in never links
        into a development-created account, so an arbitrary email can never
        take over a real Google identity.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          description: A session for the development identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The request source is outside the configured development-login
            network allowlist (code `DEV_LOGIN_NETWORK_DENIED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The endpoint is not mounted (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The email already belongs to a Google-verified account (code `IDENTITY_CONFLICT`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the session tokens
      description: |
        Validates the refresh token, then rotates both tokens: the response
        carries a new access/refresh pair and the old pair stops working. A
        revoked or rotated-out refresh token is rejected with 401.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  $ref: "#/components/schemas/PlainTextToken"
      responses:
        "200":
          description: The rotated session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: The refresh token is unknown, expired or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/signout:
    post:
      operationId: signOut
      summary: Revoke the session that issued the request
      security:
        - bearerAuth: []
      tags: [auth]
      responses:
        "204":
          description: The session was revoked.
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Read the authenticated account
      security:
        - bearerAuth: []
      tags: [me]
      responses:
        "200":
          description: The account profile and privacy consent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMe
      summary: Update the account profile
      security:
        - bearerAuth: []
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMe
      summary: Delete the account and all related data
      description: |
        Deletes the user row; devices and sessions cascade. The audit log
        keeps an anonymized record (user id and action only) that survives
        the deletion.

        An owner of a circle that still has other members must dissolve the
        circle explicitly first (`POST /circles/{circleId}/leave` with
        `dissolve=true`); account deletion refuses with 409
        `CIRCLE_HAS_MEMBERS` so a populated circle is never dissolved as a
        side effect. Circles the caller owns that have no other members are
        removed by the same transaction.
      security:
        - bearerAuth: []
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be `true`; guards against accidental deletion.
      responses:
        "204":
          description: The account was deleted.
        "400":
          description: "The `confirm` field is missing or not `true`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The account owns a circle that still has members (code `CIRCLE_HAS_MEMBERS`). Dissolve the circle first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/me/location-sharing:
    put:
      operationId: setLocationSharing
      summary: Turn the account's location-sharing consent on or off
      description: |
        The single consent switch of the privacy foundation: while disabled,
        the backend must refuse to ingest or distribute this user's location
        regardless of what any client claims. Every change is audited.
      security:
        - bearerAuth: []
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, expectedVersion]
              properties:
                enabled:
                  type: boolean
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Consent version returned by the latest user read; stale versions receive 409.
      responses:
        "200":
          description: The updated consent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Consent changed since expectedVersion (code `CONSENT_VERSION_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices:
    get:
      operationId: listDevices
      summary: List the devices and active sessions of the account
      security:
        - bearerAuth: []
      tags: [devices]
      responses:
        "200":
          description: The devices, each with its active session if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      summary: Revoke a device and all its sessions
      description: |
        Ownership is enforced per request: a device id that does not belong
        to the authenticated account yields 404, never someone else's data.
      security:
        - bearerAuth: []
      tags: [devices]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The device row and its sessions were removed.
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such device under this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/locations/batch:
    post:
      operationId: ingestLocationBatch
      summary: Upload a batch of location events
      description: |
        Ingests location points captured by the authenticated device. The
        caller is identified by its session; a `userId` in the body is never
        accepted as authority.

        **Authorization, checked inside the ingestion transaction:** a live
        session, an account that still exists, a device that belongs to that
        session and account, server-confirmed location-sharing consent, and
        an active Circle membership. A consent revocation or Circle leave
        that committed before the batch is therefore visible to it; an
        upload that holds the locks first commits while the state was still
        valid. Circle administrative roles grant no location access: the
        client device id must match the session's own device, so an owner
        cannot upload on behalf of a member.

        **Timestamps:** `recordedAt` is the device capture time and is
        stored unchanged, even for a delayed offline upload. The server
        records its own `receivedAt`. The server rejects a capture time more
        than 2 minutes in the future (`LOCATION_BATCH_INVALID`) or older
        than the retention window (`LOCATION_EVENT_TOO_OLD`); it never
        rewrites the timestamp to the upload time.

        **Atomic batch semantics:** the batch is accepted or rejected as a
        whole. HTTP 200 means every listed event is durably committed (or
        was already stored as a duplicate). There is no partial acceptance.
        Retrying the same event id for the same account returns it in
        `duplicates` and creates no new row, so an at-least-once client
        cannot duplicate data. Within one batch an event id may appear only
        once; a repeated id rejects the batch.

        **Limits:** at most 200 events per request and 512 KiB of request
        body. A batch larger than that is refused, not truncated.
      tags: [locations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationBatchRequest"
      responses:
        "200":
          description: |
            The batch is durably stored. `accepted` lists newly inserted
            events; `duplicates` lists events that already existed for this
            owner and were left untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationBatchResponse"
        "400":
          description: |
            The body is malformed, a field is outside its range, an event id
            repeats inside the batch, the batch is empty or too large
            (`LOCATION_BATCH_INVALID` / `LOCATION_BATCH_TOO_LARGE`), or a
            capture time is older than the retention window
            (`LOCATION_EVENT_TOO_OLD`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The batch claims a device other than the one behind the session,
            or the session/device/account is no longer valid
            (`DEVICE_NOT_AUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Server-confirmed consent is off (`LOCATION_CONSENT_REQUIRED`) or
            the account has no active Circle membership
            (`LOCATION_CIRCLE_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeds the size limit (`LOCATION_BATCH_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many ingestion requests from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database is temporarily unavailable (`LOCATION_TEMPORARILY_UNAVAILABLE`); retry with backoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/location-sharing/audience:
    get:
      operationId: getLocationAudience
      summary: List the authenticated owner's active location viewers
      description: |
        Returns only active grants created by the authenticated location
        owner. Circle membership and Circle owner/admin roles do not grant
        visibility. A grant is active only in its current sharing epoch and
        membership periods. Responses are private and are not cacheable.
      tags: [location-sharing]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active explicit viewers of the caller's current location epoch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationAudience"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/location-sharing/audience/{viewerId}:
    put:
      operationId: grantLocationAudience
      summary: Grant the selected current Circle member access to new location points
      description: |
        Only the authenticated location owner may grant visibility. Both
        accounts must have current membership periods in the same Circle,
        the owner must have server-confirmed consent ON and an active sharing
        epoch, and the grant begins at server time. This never grants points
        captured before the grant time. The operation is idempotent while an
        equivalent grant remains active.
      tags: [location-sharing]
      security:
        - bearerAuth: []
      parameters:
        - name: viewerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Anve-Expected-Owner
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Prevents a request started under a previous signed-in account from mutating the current account.
      responses:
        "200":
          description: The active explicit grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationAudienceGrant"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The target is not a current member of the same Circle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The owner's location-sharing consent is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeLocationAudience
      summary: Revoke the selected member's location access
      description: |
        The authenticated owner revokes all active grants for the selected
        viewer. Future reads are denied by PostgreSQL authorization queries;
        polling clients remove the marker on their next authorized snapshot.
        Data already delivered to a device cannot be recalled.
      tags: [location-sharing]
      security:
        - bearerAuth: []
      parameters:
        - name: viewerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Anve-Expected-Owner
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Must match the authenticated owner to prevent account-switch races.
      responses:
        "204":
          description: The viewer has no remaining active grant; repeated revocation is safe.
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/locations/visible/latest:
    get:
      operationId: getLatestVisibleLocations
      summary: Read latest locations the authenticated viewer is allowed to see
      description: |
        PostgreSQL enforces current owner and viewer membership, explicit
        grant, active sharing epoch, server consent, grant time and retention
        in the query. Both capture time and server receive time must be at or
        after the grant boundary. Existing M3 points without an epoch are never returned.
        `FRESH`, `DELAYED`, `STALE` and `UNKNOWN` describe capture-time
        evidence; the server does not infer `OFFLINE` from missing GPS fixes.
        Conditional polling uses ETag while the map screen is foregrounded.
      tags: [locations]
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from the previous authorized snapshot.
      responses:
        "200":
          description: One latest authorized row per active explicit grant, including UNKNOWN when no retained point exists.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store, private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestVisibleLocations"
        "304":
          description: The authorized snapshot is unchanged.
          headers:
            ETag:
              schema:
                type: string
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles:
    post:
      operationId: createCircle
      summary: Create a Family Circle
      description: |
        The creator becomes the circle's owner (administrative role). MVP
        allows one active circle per user; a second create attempt answers
        409 `ACTIVE_CIRCLE_EXISTS`. Creating a circle never turns on
        location sharing for anyone.
      tags: [circles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCircleRequest"
      responses:
        "201":
          description: The circle was created; the caller is its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMembership"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller already belongs to an active circle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles/mine:
    get:
      operationId: getMyCircle
      summary: Read the caller's current circle and membership
      description: |
        Returns `circle: null` when the caller belongs to no circle — an
        empty state, not an error.
      tags: [circles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's circle and membership, or nulls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMembership"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles/{circleId}:
    patch:
      operationId: updateCircle
      summary: Rename the circle (owner only)
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCircleRequest"
      responses:
        "200":
          description: The updated circle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is a member but not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such circle under the caller's membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles/{circleId}/members:
    get:
      operationId: listMembers
      summary: List the circle's members
      description: |
        Members see each other's display name, role and join time — nothing
        about devices or sessions, which stay private per account.
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller is not an active member of this circle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles/{circleId}/members/{userId}/remove:
    post:
      operationId: removeMember
      summary: Remove a member from the circle (owner only)
      description: |
        The owner may remove ordinary members. Owners cannot be removed by
        another member; the owner leaves (or dissolves) through the leave
        endpoint. Removal ends every access the member derived from the
        circle.
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The member was removed.
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is a member but not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in a circle the caller belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles/{circleId}/leave:
    post:
      operationId: leaveCircle
      summary: Leave the circle, or dissolve it as the owner
      description: |
        An ordinary member always leaves. The owner of a circle with other
        members must pass `dissolve: true` (the circle and all memberships
        are deleted); without it the request answers 409
        `CIRCLE_HAS_MEMBERS` so dissolution stays an explicit choice. A
        sole owner leaves by dissolving implicitly.
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveCircleRequest"
      responses:
        "204":
          description: The caller left; the circle may have been dissolved.
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller is not an active member of this circle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The owner must confirm dissolution with `dissolve: true`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/circles/{circleId}/invites:
    post:
      operationId: createInvite
      summary: Create an invite code (owner only)
      description: |
        Single-use code, default validity 48 hours. The code is the only
        thing needed to join, so treat it as a capability: it can be
        revoked and expires on its own.
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The created invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is a member but not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such circle under the caller's membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: listInvites
      summary: List the circle's outstanding invites (owner only)
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The invites that are still redeemable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is a member but not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such circle under the caller's membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Revoke an invite (owner only)
      tags: [circles]
      security:
        - bearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The invite was revoked.
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is a member but not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invite in a circle the caller owns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/invites/redeem:
    post:
      operationId: redeemInvite
      summary: Join a circle with an invite code
      description: |
        Validates the code (exists, not expired, not used, not revoked),
        requires that the caller belongs to no other active circle, then
        creates the membership and burns the code — all in one
        transaction. Joining never turns on location sharing.
      tags: [circles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInviteRequest"
      responses:
        "200":
          description: The joined circle and the caller's membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMembership"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The code is expired/used/revoked (`INVITE_UNAVAILABLE`) or the
            caller already belongs to a circle (`ACTIVE_CIRCLE_EXISTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The AnVề session access token issued by the auth endpoints. Not a
        Google token: Google identity is only used once at sign-in.

  schemas:
    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          description: The service state.
          examples: ["ok"]
        version:
          type: string
          description: The running build version.
          examples: ["0.2.0"]
        time:
          type: string
          format: date-time
          description: The moment the response was produced, in UTC.

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The running build version.
          examples: ["0.2.0"]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable, stable error code (UPPER_SNAKE_CASE).
          examples: ["UNAUTHENTICATED"]
        message:
          type: string
          description: Human-readable explanation.
        requestId:
          type: string
          description: The request id assigned by the router, for support correlation.

    AuthConfig:
      type: object
      required: [googleSignIn, devLogin]
      properties:
        googleSignIn:
          type: boolean
          description: Whether `POST /api/v1/auth/google` is usable (OAuth client configured).
        devLogin:
          type: boolean
          description: Whether the development login is mounted. Always `false` in production.

    PlainTextToken:
      type: string
      description: An opaque, URL-safe token. Treat as a secret; it is valid exactly once per rotation.

    DeviceRegistration:
      type: object
      required: [clientDeviceId]
      properties:
        clientDeviceId:
          type: string
          minLength: 8
          maxLength: 64
          description: Stable, app-generated device identifier (a UUID kept in private storage).
        name:
          type: string
          maxLength: 120
          description: Human-readable device name (e.g. model), shown in the device list.
        platform:
          type: string
          enum: [android]
          default: android
        appVersion:
          type: string
          maxLength: 40
          description: Version of the calling app build.

    GoogleSignInRequest:
      type: object
      required: [idToken, device]
      properties:
        idToken:
          type: string
          description: The Google ID token obtained through Credential Manager.
        device:
          $ref: "#/components/schemas/DeviceRegistration"

    DevLoginRequest:
      type: object
      required: [email, device]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        device:
          $ref: "#/components/schemas/DeviceRegistration"

    User:
      type: object
      required: [id, email, displayName, locationSharingEnabled, locationSharingVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        locationSharingEnabled:
          type: boolean
          description: The account's location-sharing consent. Off by default; never turned on implicitly.
        locationSharingVersion:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic compare-and-set version for consent mutations.
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80

    SessionTokens:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt, refreshExpiresAt]
      properties:
        accessToken:
          $ref: "#/components/schemas/PlainTextToken"
        refreshToken:
          $ref: "#/components/schemas/PlainTextToken"
        accessExpiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time

    SignInResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/SessionTokens"

    RefreshResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/SessionTokens"

    DeviceSession:
      type: object
      required: [id, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the refresh token expires.
        current:
          type: boolean
          description: Whether this is the session that served the request.

    Device:
      type: object
      required: [id, name, platform, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        appVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/DeviceSession"

    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    LocationEvent:
      type: object
      required:
        - eventId
        - clientDeviceId
        - recordedAt
        - latitude
        - longitude
        - horizontalAccuracyMeters
        - provider
      properties:
        eventId:
          type: string
          format: uuid
          description: Client-generated event identity; the server idempotency key (scoped to the account).
        clientDeviceId:
          type: string
          minLength: 8
          maxLength: 64
          description: |
            Must equal the client device id of the device that owns the
            session. It identifies this app installation, never another
            member or another account's device.
        recordedAt:
          type: string
          format: date-time
          description: |
            Device capture time in UTC. Preserved unchanged on the server;
            a delayed upload does not rewrite it.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        horizontalAccuracyMeters:
          type: number
          format: double
          minimum: 0
          maximum: 100000
          description: Provider-reported accuracy radius. Never fabricated or omitted.
        altitudeMeters:
          type: number
          format: double
        speedMetersPerSecond:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        bearingDegrees:
          type: number
          format: double
          minimum: 0
          maximum: 360
        provider:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[a-z0-9_-]+$"
          description: Location source reported by the OS/provider (fused, gps, network, passive…).
        isMock:
          type: boolean
          default: false
          description: Client-reported mock-provider flag. Stored so consumers can exclude synthetic fixes.
        schemaVersion:
          type: integer
          minimum: 1
          maximum: 16
          default: 1
          description: Client event schema version, for forward-compatible parsing.

    LocationBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/LocationEvent"

    LocationBatchResponse:
      type: object
      required: [accepted, duplicates, receivedAt]
      properties:
        accepted:
          type: array
          description: Event ids inserted by this request.
          items:
            type: string
            format: uuid
        duplicates:
          type: array
          description: Event ids already stored for this account; no row was created.
          items:
            type: string
            format: uuid
        receivedAt:
          type: string
          format: date-time
          description: Server write time of this batch. Never a replacement for the device capture time.

    LocationAudienceGrant:
      type: object
      required: [id, viewerId, displayName, circleId, generation, visibleFrom, createdAt]
      properties:
        id:
          type: string
          format: uuid
        viewerId:
          type: string
          format: uuid
        displayName:
          type: string
        circleId:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        visibleFrom:
          type: string
          format: date-time
          description: Server-authoritative earliest capture time this grant may expose.
        createdAt:
          type: string
          format: date-time

    LocationAudience:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/LocationAudienceGrant"

    LatestVisibleLocations:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/VisibleLocation"

    VisibleLocation:
      type: object
      required: [ownerId, displayName, ageMillis, confidence]
      properties:
        ownerId:
          type: string
          format: uuid
        displayName:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        horizontalAccuracyMeters:
          type: number
          format: double
          nullable: true
          minimum: 0
        recordedAt:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true
        ageMillis:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Server-computed age at snapshot generation; null when no eligible sample exists.
        confidence:
          type: string
          enum: [FRESH, DELAYED, STALE, OFFLINE, UNKNOWN]
          description: Offline is reserved for a future authoritative presence signal and is not inferred from missing GPS data.

    Circle:
      type: object
      required: [id, name, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Membership:
      type: object
      required: [circleId, userId, role, joinedAt]
      properties:
        circleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
          format: date-time

    CircleMembership:
      type: object
      required: [circle, membership]
      properties:
        circle:
          allOf:
            - $ref: "#/components/schemas/Circle"
          nullable: true
        membership:
          allOf:
            - $ref: "#/components/schemas/Membership"
          nullable: true

    Member:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
          format: date-time

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    Invite:
      type: object
      required: [id, circleId, code, createdBy, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        circleId:
          type: string
          format: uuid
        code:
          type: string
          description: Single-use join code; treat as a capability.
        createdBy:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"

    CreateCircleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80

    CreateInviteRequest:
      type: object
      properties:
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 168
          default: 48
          description: Invite validity window; capped at 7 days.

    RedeemInviteRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 32

    LeaveCircleRequest:
      type: object
      required: [dissolve]
      properties:
        dissolve:
          type: boolean
          description: Must be true for an owner who still has members.
