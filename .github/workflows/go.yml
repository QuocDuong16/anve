name: Go

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # mise.toml and mise.lock are the single source of truth for the Go
      # toolchain and the analysis tools, so CI resolves the same versions
      # as a developer machine. The action adds --locked on its own because
      # the repository carries a mise lock file, and the tool list keeps a
      # runner with its own global mise config from pulling in extra tools.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
          install_args: go golangci-lint go:golang.org/x/vuln/cmd/govulncheck

      - name: Verify toolchain pins
        working-directory: .
        run: bash scripts/check_toolchain_versions.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Check for known vulnerabilities
        run: govulncheck ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: go build ./cmd/...

  # The unit job above runs with the database-backed integration tests
  # skipped (no TEST_DATABASE_URL). This job proves migrations, auth/Circle
  # stores and M3/M4 location authorization against PostgreSQL/PostGIS,
  # including temporal grants, revocation races, and response ETag changes.
  database-integration:
    name: Migrations and store against PostgreSQL/PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/server
    services:
      postgres:
        # Pinned by digest to the same image the local Compose stack uses.
        image: postgis/postgis:17-3.6@sha256:d7053f57b0d62c427ffbf412208b6625317124d62eebf40672e990fea81e9d53
        env:
          POSTGRES_USER: anve
          POSTGRES_PASSWORD: anve
          POSTGRES_DB: anve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anve -d anve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
          install_args: go

      - name: Run migration and store integration tests
        env:
          TEST_DATABASE_URL: postgres://anve:anve@localhost:5432/anve?sslmode=disable
        run: go test -race -count=1 ./cmd/migrate ./internal/auth ./internal/circles ./internal/locations ./internal/locationaccess ./internal/httpapi

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
          install_args: actionlint

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Validate the OpenAPI contract
        run: |
          python - <<'PY'
          import sys
          import yaml

          with open("packages/api-contracts/openapi.yaml", encoding="utf-8") as handle:
              spec = yaml.safe_load(handle)

          assert spec["openapi"].startswith("3."), "unexpected OpenAPI version"
          assert spec["paths"], "the contract declares no paths"
          for path, operations in spec["paths"].items():
              assert operations, f"no operations declared for {path}"
          print(f"OpenAPI contract OK: {len(spec['paths'])} paths")
          PY

      - name: Lint the GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

      - name: Validate the Dependabot configuration
        run: python3 scripts/check_dependabot.py

      - name: Validate the local Compose network exposure
        run: python3 scripts/check_compose_ports.py
