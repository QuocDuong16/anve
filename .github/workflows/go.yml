name: Go

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # mise.toml and mise.lock are the single source of truth for the Go
      # toolchain and the analysis tools, so CI resolves the same versions
      # as a developer machine. The tools are listed explicitly so that a
      # runner carrying its own global mise config cannot pull extra tools
      # into the locked install.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.15
          install: false

      - name: Install the locked toolchain
        run: |
          mise install --locked \
            go \
            java \
            gradle \
            golangci-lint \
            actionlint \
            go:golang.org/x/tools/gopls \
            go:golang.org/x/vuln/cmd/govulncheck \
            go:github.com/securego/gosec/v2/cmd/gosec

      - name: Verify toolchain pins
        working-directory: .
        run: bash scripts/check_toolchain_versions.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: go build ./cmd/...

  contracts:
    name: Validate API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Validate the OpenAPI contract
        run: |
          python - <<'PY'
          import sys
          import yaml

          with open("packages/api-contracts/openapi.yaml", encoding="utf-8") as handle:
              spec = yaml.safe_load(handle)

          assert spec["openapi"].startswith("3."), "unexpected OpenAPI version"
          assert spec["paths"], "the contract declares no paths"
          for path, operations in spec["paths"].items():
              assert operations, f"no operations declared for {path}"
          print(f"OpenAPI contract OK: {len(spec['paths'])} paths")
          PY
