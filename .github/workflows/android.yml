name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    env:
      # Pinned in apps/android/gradle/libs.versions.toml. Keep both in sync
      # with the compileSdk / buildTools the project declares.
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      # Android command-line tools release installed by setup-android.
      CMDLINE_TOOLS_VERSION: "15859902"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The JDK and the Gradle distribution come from mise.toml / mise.lock,
      # so CI uses exactly the versions a developer machine uses. The tools
      # are listed explicitly so that a runner carrying its own global mise
      # config cannot pull extra tools into the locked install.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.15
          install: false

      - name: Install the locked toolchain
        run: |
          mise install --locked \
            java \
            gradle

      # v4 is required: v3 still ran `sdkmanager tools`, and Google removed
      # that legacy package from the SDK repository, so every v3 run failed
      # with "Failed to find package 'tools'". v4 skips it explicitly.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: |
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}

      - name: Accept the Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify the Android SDK
        run: |
          installed="$(sdkmanager --list_installed)"
          echo "$installed"
          grep -q "platforms;android-${COMPILE_SDK}" <<<"$installed" || {
            echo "platforms;android-${COMPILE_SDK} is not installed" >&2
            exit 1
          }
          grep -q "build-tools;${BUILD_TOOLS}" <<<"$installed" || {
            echo "build-tools;${BUILD_TOOLS} is not installed" >&2
            exit 1
          }

      - name: Verify toolchain pins
        working-directory: .
        run: bash scripts/check_toolchain_versions.sh

      - name: Point Gradle at the JDK pinned in mise.toml
        run: echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run the lint checks
        run: ./gradlew :app:lintDebug

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anve-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
