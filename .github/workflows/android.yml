name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    env:
      # Pinned in apps/android/gradle/libs.versions.toml. Keep both in sync
      # with the compileSdk / buildTools the project declares.
      COMPILE_SDK: "37"
      BUILD_TOOLS: "37.0.0"
      # The platform package carries a minor suffix (android-37.0), so it is
      # pinned separately and checked against COMPILE_SDK.
      ANDROID_PLATFORM: "platforms;android-37.0"
      # Android command-line tools release installed by setup-android.
      CMDLINE_TOOLS_VERSION: "15859902"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The JDK and the Gradle distribution come from mise.toml / mise.lock,
      # so CI uses exactly the versions a developer machine uses. The action
      # adds --locked on its own because the repository carries a mise lock
      # file, and the tool list keeps a runner with its own global mise
      # config from pulling in extra tools.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
          install_args: java gradle

      # v4 is required: v3 still ran `sdkmanager tools`, and Google removed
      # that legacy package from the SDK repository, so every v3 run failed
      # with "Failed to find package 'tools'". v4 skips it explicitly.
      #
      # The `packages` input is split on SPACES by the action, so it must be
      # a single space-separated line — a YAML block scalar would arrive as
      # one bogus package name.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: platform-tools ${{ env.ANDROID_PLATFORM }} build-tools;${{ env.BUILD_TOOLS }}

      - name: Accept the Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # The SDK layout is checked directly instead of through
      # `sdkmanager --list_installed`, so the check keeps working when the
      # command-line tools change their reporting interface.
      - name: Verify the Android SDK
        run: |
          platform_dir="${ANDROID_HOME}/platforms/${ANDROID_PLATFORM#platforms;}"
          for directory in "${platform_dir}" "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}" "${ANDROID_HOME}/platform-tools"; do
            if [ ! -d "$directory" ]; then
              echo "Android SDK package missing: $directory" >&2
              exit 1
            fi
            echo "✓ $directory"
          done

      - name: Verify toolchain pins
        working-directory: .
        run: bash scripts/check_toolchain_versions.sh

      - name: Point Gradle at the JDK pinned in mise.toml
        run: echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run the lint checks
        run: ./gradlew :app:lintDebug

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify minified validation AAB and ephemeral signing
        id: release_check
        working-directory: .
        run: make android-release-check

      - name: Upload validation AAB and verification record
        uses: actions/upload-artifact@v7
        with:
          name: anve-release-validation
          path: ${{ steps.release_check.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized privacy review inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anve-privacy-review
          path: apps/android/app/build/outputs/privacy-review/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload signed fixture APK for runtime smoke
        uses: actions/upload-artifact@v7
        with:
          name: anve-signed-validation-apk
          path: ${{ steps.release_check.outputs.smoke_apk_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anve-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-smoke:
    name: Signed minified fixture startup
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANVE_SIGNED_SMOKE_DISPOSABLE: "1"
      SIGNED_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/signed-validation-apk
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.9.15
          install_args: java
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - name: Use the pinned JDK
        run: echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"
      - name: Download this run's verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anve-signed-validation-apk
          path: ${{ env.SIGNED_SMOKE_ARTIFACT_DIR }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the signed minified fixture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: make android-signed-smoke
      - name: Upload sanitized signed runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anve-signed-smoke-results
          path: apps/android/app/build/outputs/signed-smoke/
          if-no-files-found: warn
          retention-days: 7

  emulator:
    name: Emulator lifecycle, history, places, diagnostics and journeys UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
          install_args: java gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Use the pinned JDK
        run: echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on a headless emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          pre-emulator-launch-script: make android-validation-avd
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: make android-emulator-validation
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-results
          path: |
            apps/android/app/build/outputs/androidTest-results/connected/
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/ui-validation/
          if-no-files-found: warn
          retention-days: 14
